name: NAVARRO V59 - validar diseño real en iPhone
on:
  push:
    paths:
      - '.github/workflows/navarro-v59-prueba.yml'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar vista móvil aislada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('navarro360-movil/index.html').read_text()
          assert html.count('</head>')==1
          assert 'tarjetas-movil-v59.css' not in html
          html=html.replace('</head>','<link rel="stylesheet" href="./tarjetas-movil-v59.css?v=59">\n</head>')
          Path('navarro360-movil/test-movil-v59.html').write_text(html)
          PY
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir página local
        run: |
          nohup python3 -m http.server 8111 --directory navarro360-movil >/tmp/navarro-v59-http.log 2>&1 &
          sleep 2
      - name: Verificar que las tarjetas no dividan la foto en un 41% de ancho
        timeout-minutes: 6
        run: node tools/navarro_v59_mobile_test.cjs
      - name: Guardar diagnóstico y captura de iPhone
        if: always()
        run: |
          if [ -f navarro-v59-mobile-test.json ]; then
            git config user.name "NAVARRO 360 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add navarro-v59-mobile-test.json
            git commit -m "NAVARRO V59: capturar prueba móvil de fotos grandes centradas"
            for i in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
