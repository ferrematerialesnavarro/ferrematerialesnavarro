name: NAVARRO V53 - verificar últimas imágenes oficiales
on:
  push:
    paths:
      - '.github/workflows/navarro-v53-generar.yml'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprobar fotografía oficial de códigos individuales
        run: python3 tools/navarro_truper_fotos_v53.py
      - name: Validar banco aumentado
        run: node --check navarro360-movil/truper-fotos-catalogo-v53.js
      - name: Guardar datos revisados
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/truper-fotos-catalogo-v53.js truper-v53-informe.json
          git commit -m "NAVARRO V53: fotos extras verificadas por código y respuesta del fabricante"
          git pull --rebase origin main
          git push origin HEAD:main
