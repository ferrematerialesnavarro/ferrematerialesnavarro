name: NAVARRO 360 V38 - refresco de Plomeria
on:
  push:
    paths:
      - '.github/workflows/navarro-v38-una-vez.yml'
permissions:
  contents: write
jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Invalidar version anterior de cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          html=Path('navarro360-movil/index.html')
          old='455551f5624deac12e393a83377c5965ee79aa43'
          new='964ffb5e869854ed58fcfb514eaa4b1c004ab369'
          raw=html.read_bytes()
          if sha(raw)==new:print('HTML actualizado')
          else:
              if sha(raw)!=old:raise SystemExit('Archivo HTML cambió; se detiene por seguridad')
              s=raw.decode('utf-8')
              assert s.count('sw.js?v=14')==1
              assert "['Conexiones','Tubos','Niples rectos']" in s
              assert '["7777001884","Galvanizado"' in s
              out=s.replace('sw.js?v=14','sw.js?v=38').encode('utf-8')
              assert sha(out)==new
              html.write_bytes(out)
          sw=Path('navarro360-movil/sw.js')
          raw=sw.read_bytes()
          assert sha(raw)=='09d0aa08ab4fa61050c7c73673fee113b231cff9' or b"navarro360-fullstore-v38-galvanizados" in raw
          text=raw.decode('utf-8')
          if "navarro360-fullstore-v38-galvanizados" not in text:
              assert text.count("navarro360-fullstore-v35-importe-tarjetas")==1
              text=text.replace("navarro360-fullstore-v35-importe-tarjetas","navarro360-fullstore-v38-galvanizados")
              sw.write_text(text)
          print('Comprobados archivos de Plomeria y cache V38')
          PY
      - name: Publicar archivos exclusivos
        shell: bash
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          if git diff --cached --quiet; then
            echo "V38 ya estaba publicada"
          else
            git commit -m "NAVARRO 360 V38: actualizar cache movil de tubos galvanizados"
            git push origin HEAD:main
          fi
