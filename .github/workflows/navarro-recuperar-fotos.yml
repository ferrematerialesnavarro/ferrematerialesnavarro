name: NAVARRO 360 - recuperar fotos de catalogos
on:
  push:
    paths:
      - '.github/workflows/navarro-recuperar-fotos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio existente
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar el importador
        run: node --check tools/recuperar-fotos-catalogos.js
      - name: Recuperar fotografías por código y nombre
        run: node tools/recuperar-fotos-catalogos.js
      - name: Comprobar el script de fotografías
        run: node --check navarro360-movil/fotos-recuperadas.js
      - name: Guardar imágenes y avances sin tocar el catálogo
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js navarro360-movil/fotos-recuperadas.js navarro360-movil/REPORTE_FOTOS_RECUPERADAS.txt navarro360-movil/assets/navarro-publicada-*.jpg
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "NAVARRO 360: fotografías originales de Polimex Hidraulico Galvanizado y otros PDF"
            git push origin HEAD:main
          fi
