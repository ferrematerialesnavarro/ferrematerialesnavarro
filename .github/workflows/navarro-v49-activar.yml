name: NAVARRO V49 - publicar más fotos verificadas
on:
  push:
    paths:
      - .github/workflows/navarro-v49-activar.yml
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar asociación de códigos y scripts
        run: |
          node --check navarro360-movil/truper-fotos-catalogo-v49.js
          node --check navarro360-movil/truper-fotos-integracion-v48.js
          node --check navarro360-movil/carrito-fotos-v44.js
          node -e "global.window={};require('./navarro360-movil/truper-fotos-catalogo-v49.js');const n=Object.keys(window.NAVARRO_FOTOS_TRUPER_V48).length;if(n!==8860)throw Error('Esperábamos 8860 fotos, obtuvimos '+n);console.log('SKU con fotos',n)"
      - name: Instalar versión incremental sin afectar carrito ni bot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('navarro360-movil/index.html')
          expected='97c3026ce8ac072b06e94981b84700356537d16e'
          if sha(p.read_bytes())!=expected:raise SystemExit('Base V48 cambió; no se sobreescribe')
          h=p.read_text()
          assert h.count('truper-fotos-catalogo-v48.js?v=48')==1
          assert h.count('truper-fotos-integracion-v48.js?v=48')==1
          assert h.count('sw.js?v=48')==1
          h=h.replace('truper-fotos-catalogo-v48.js?v=48','truper-fotos-catalogo-v49.js?v=49')
          h=h.replace('truper-fotos-integracion-v48.js?v=48','truper-fotos-integracion-v48.js?v=49')
          h=h.replace('sw.js?v=48','sw.js?v=49')
          p.write_text(h)
          sw=Path('navarro360-movil/sw.js')
          text=sw.read_text()
          assert text.count('navarro360-fullstore-v48-truper-fotos-7772')==1
          assert text.count('truper-fotos-catalogo-v48.js?v=48')==1
          assert text.count('truper-fotos-integracion-v48.js?v=48')==1
          text=text.replace('navarro360-fullstore-v48-truper-fotos-7772','navarro360-fullstore-v49-truper-fotos-8860')
          text=text.replace('truper-fotos-catalogo-v48.js?v=48','truper-fotos-catalogo-v49.js?v=49')
          text=text.replace('truper-fotos-integracion-v48.js?v=48','truper-fotos-integracion-v48.js?v=49')
          sw.write_text(text)
          print('V49 activada, 8860 enlaces, sin cambios en carrito original, WhatsApp o SIFO')
          PY
      - name: Publicar
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V49: 1088 fotos adicionales con EAN verificado"
          git push origin HEAD:main
