name: NAVARRO 360 V48 - preparar banco de fotos Truper
on:
  push:
    paths:
      - .github/workflows/navarro-v48-generar.yml
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Asociar fotografías por nombre único en catálogo completo
        timeout-minutes: 7
        run: python3 tools/navarro_truper_fotos_v48.py
      - name: Verificar JS
        run: node --check navarro360-movil/truper-fotos-catalogo-v48.js
      - name: Guardar banco de fotografías revisado sin activar página
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/truper-fotos-catalogo-v48.js truper-v48-informe.json
          git commit -m "NAVARRO V48: índice de fotografías del Grupo Truper con correspondencias por nombre único"
          git push origin HEAD:main
