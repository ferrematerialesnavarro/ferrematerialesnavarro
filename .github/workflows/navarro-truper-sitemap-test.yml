name: NAVARRO - comprobar catálogo exacto y EAN Truper
on:
  push:
    paths:
      - .github/workflows/navarro-truper-sitemap-test.yml
permissions:
  contents: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analizar equivalencias de códigos
        timeout-minutes: 4
        run: python3 tools/navarro-truper-sitemap-test.py
      - name: Guardar diagnóstico
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truper-prueba-sitemap.json
          git commit -m "Validar correspondencias EAN e imágenes Grupo Truper"
          git push origin HEAD:main
