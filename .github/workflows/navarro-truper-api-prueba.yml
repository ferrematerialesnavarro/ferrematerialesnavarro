name: NAVARRO Truper: prueba EAN en banco oficial
on:
  push:
    paths:
      - .github/workflows/navarro-truper-api-prueba.yml
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar búsqueda EAN y fuentes existentes
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,re,time,collections
          urls=[
           'https://www.truper.com/banco-contenido-digital/searching/searchByWord?q=7506240653295',
           'https://www.truper.com/banco-contenido-digital/searching/searchByWord?q=13470',
           'https://www.truper.com/banco-contenido-digital/searching/searchByWord?q=WT-350',
           'https://www.truper.com/banco-contenido-digital/searching/searchByWord?q=7506240674542',
           'https://www.truper.com/banco-contenido-digital/searching/searchByWord?q=PET-15X',
           'https://ferreteriastrp.com/sitemap.xml',
           'https://ferrexmayorista.com/sitemap.xml'
          ]
          data=[]
          for url in urls:
           entry={'url':url}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}),timeout=30) as r:
             full=r.read(2500000)
             entry.update(status=r.status,size=len(full),content_type=r.headers.get('Content-Type'),final=r.url)
            s=full.decode('utf-8','replace')
            if 'sitemap' in url:
             entry['url_count']=len(re.findall('<loc>',s))
             entry['sample_products']=re.findall(r'<loc>([^<]+(?:/productos/|/tienda/producto/)[^<]+)</loc>',s)[:6]
             entry['tail']=s[-250:]
            else:entry['body']=s[:3000]
           except Exception as e:entry['error']=str(e)
           data.append(entry)
          from pathlib import Path
          Path('diagnostico-truper-api.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print([(i['url'].split('?')[0],i.get('status'),i.get('size'),i.get('url_count')) for i in data])
          PY
      - name: Guardar resultados temporales
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico-truper-api.json
          git commit -m "Diagnóstico EAN y API oficial Truper"
          git push origin HEAD:main

# Reejecutar tras terminar diagnósticos anteriores
