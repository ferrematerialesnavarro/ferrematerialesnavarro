name: NAVARRO V54.2 - activar motor IA local
on:
  push:
    paths:
      - '.github/workflows/navarro-v542-activar.yml'
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Revisar motor local y modelo
        run: |
          node --check navarro360-movil/buscar-foto-v54.js
          node --check navarro360-movil/vendor/mediapipe/vision_bundle.mjs
          test -s navarro360-movil/vendor/mediapipe/wasm/vision_wasm_internal.wasm
          test -s navarro360-movil/vendor/mediapipe/mobilenet_v3_small.tflite
          grep -q "vendor/mediapipe/vision_bundle.mjs" navarro360-movil/buscar-foto-v54.js
      - name: Renovar caché para evitar errores de CDN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('navarro360-movil/index.html')
          if sha(p.read_bytes())!='b0791887961e67f69860abea14e25d19dca4435d':raise SystemExit('HTML modificado; no sustituirlo')
          text=p.read_text()
          assert text.count('buscar-foto-v54.js?v=541')==1
          assert text.count('sw.js?v=541')==1
          text=text.replace('buscar-foto-v54.js?v=541','buscar-foto-v54.js?v=542')
          text=text.replace('sw.js?v=541','sw.js?v=542')
          p.write_text(text)
          sw=Path('navarro360-movil/sw.js')
          s=sw.read_text()
          assert s.count('navarro360-fullstore-v541-boton-foto-visible')==1
          assert s.count("'./buscar-foto-v54.js?v=541'")==1
          s=s.replace('navarro360-fullstore-v541-boton-foto-visible','navarro360-fullstore-v542-motor-visual-local')
          s=s.replace("'./buscar-foto-v54.js?v=541'","'./buscar-foto-v54.js?v=542'")
          sw.write_text(s)
          print('V54.2: IA local lista, fotografías del usuario permanecen en el dispositivo.')
          PY
      - name: Publicar actualización
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V54.2: búsqueda por fotografía con motor local, sin CDN"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
