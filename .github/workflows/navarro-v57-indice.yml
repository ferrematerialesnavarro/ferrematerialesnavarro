name: NAVARRO V57 - índice rápido para búsqueda por foto
on:
  push:
    paths:
      - '.github/workflows/navarro-v57-indice.yml'
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convertir sin pérdida el índice de 15953 fotografías
        run: python3 tools/navarro_v57_indice_binario.py
      - name: Guardar índice verificado
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/buscar-foto-indice-v57.bin.gz navarro360-movil/buscar-foto-indice-info-v57.json
          git commit -m "NAVARRO V57: índice fotográfico binario comprimido de carga rápida"
          for i in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
