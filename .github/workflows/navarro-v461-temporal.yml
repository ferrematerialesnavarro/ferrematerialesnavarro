name: NAVARRO 360 V46.1 - foto exacta prioritaria
on:
  push:
    paths:
      - '.github/workflows/navarro-v461-temporal.yml'
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar
        run: node --check navarro360-movil/carrito-fotos-v44.js
      - name: Renovar caché priorizando SKU
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('navarro360-movil/index.html')
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert sha(p.read_bytes())=='fdb7b1f4d44a00b67efa2a3809649c29565593d0'
          t=p.read_text()
          assert t.count('carrito-fotos-v44.js?v=46')==1 and t.count('sw.js?v=46')==1
          p.write_text(t.replace('carrito-fotos-v44.js?v=46','carrito-fotos-v44.js?v=461').replace('sw.js?v=46','sw.js?v=461'))
          sw=Path('navarro360-movil/sw.js')
          s=sw.read_text()
          assert s.count('navarro360-fullstore-v46-fotos-atlas-y-modulos')==1
          assert s.count('carrito-fotos-v44.js?v=46')==1
          sw.write_text(s.replace('navarro360-fullstore-v46-fotos-atlas-y-modulos','navarro360-fullstore-v461-fotos-sku-prioridad').replace('carrito-fotos-v44.js?v=46','carrito-fotos-v44.js?v=461'))
          PY
      - name: Publicar
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V46.1: asegurar la imagen específica de cada SKU"
          git push origin HEAD:main
