name: NAVARRO 360 V42 - lector USB en buscador
on:
  push:
    paths:
      - '.github/workflows/navarro-v42-temporal.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar módulo lector USB
        run: node --check navarro360-movil/lector-usb-v42.js
      - name: Integrar lector sin cambiar carrito
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=Path('navarro360-movil/index.html')
          s=Path('navarro360-movil/sw.js')
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          raw=h.read_bytes()
          if sha(raw)!='2fe36fc7c7cc08f3eb5e6f136693bab9e8ba5c5a':raise SystemExit('HTML distinto de V41; se cancela')
          content=raw.decode('utf-8')
          assert content.count('</head>')==1 and content.count('sw.js?v=41')==1
          content=content.replace('</head>','<script defer src="./lector-usb-v42.js?v=42"></script>\n</head>')
          content=content.replace('sw.js?v=41','sw.js?v=42')
          h.write_text(content)
          t=s.read_text()
          assert t.count('navarro360-fullstore-v41-escaner-continuo')==1
          t=t.replace('navarro360-fullstore-v41-escaner-continuo','navarro360-fullstore-v42-lector-usb')
          t=t.replace("'./escaner-barras.js?v=41'","'./escaner-barras.js?v=41','./lector-usb-v42.js?v=42'")
          s.write_text(t)
          print('HTML, caché y lector listos. SIFO y carrito sin modificaciones.')
          PY
      - name: Guardar actualización
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO 360 V42: escanear en buscador, sumar y limpiar para siguiente"
          git push origin HEAD:main
