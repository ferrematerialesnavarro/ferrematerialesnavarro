name: NAVARRO V58 - auditar tarjetas e imágenes
on:
  push:
    paths:
      - '.github/workflows/navarro-v58-inspeccion.yml'
permissions:
  contents: write
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inspeccionar estructura sin modificar sitio
        run: python3 tools/navarro_v58_css_audit.py
      - name: Guardar informe técnico
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro-v58-css-auditoria.json
          git commit -m "Auditoría de estilos de fotos de productos NAVARRO V58"
          for i in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

# Diagnóstico optimizado de estilos y sprites.

# Corregida la captura del informe técnico.
