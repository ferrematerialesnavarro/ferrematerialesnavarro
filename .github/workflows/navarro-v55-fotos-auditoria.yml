name: NAVARRO - auditar imágenes disponibles V55
on:
  push:
    paths:
      - '.github/workflows/navarro-v55-fotos-auditoria.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar fotografías del catálogo y atlas
        run: python3 tools/navarro_v55_photo_audit.py
      - name: Guardar auditoría sin cambiar tienda
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro-v55-photo-audit.json
          git commit -m "Auditoría de fuentes fotográficas del catálogo NAVARRO 360"
          git pull --rebase origin main
          git push origin HEAD:main
