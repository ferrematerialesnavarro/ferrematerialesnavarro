name: NAVARRO V52 - publicar 15619 fotos Truper verificadas
on:
  push:
    paths:
      - '.github/workflows/navarro-v52-activar.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar banco y miniaturas
        run: |
          node --check navarro360-movil/truper-fotos-catalogo-v52.js
          node --check navarro360-movil/truper-fotos-integracion-v48.js
          node --check navarro360-movil/carrito-fotos-v44.js
          node -e "global.window={};require('./navarro360-movil/truper-fotos-catalogo-v52.js');const n=Object.keys(window.NAVARRO_FOTOS_TRUPER_V48).length;if(n!==15619)throw Error('Esperados 15619, encontrados '+n);console.log('SKU con asociación',n)"
      - name: Actualizar solo fuentes de imágenes y caché
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          h=Path('navarro360-movil/index.html')
          if sha(h.read_bytes())!='cad864a52ae84228e127fe5932b79d7ccbe9231f':raise SystemExit('La página cambió; no se sobreescribirá.')
          changes={
            'truper-fotos-catalogo-v51.js?v=51':'truper-fotos-catalogo-v52.js?v=52',
            'truper-fotos-integracion-v48.js?v=49':'truper-fotos-integracion-v48.js?v=52',
            'carrito-fotos-v44.js?v=48':'carrito-fotos-v44.js?v=52',
            'sw.js?v=51':'sw.js?v=52'
          }
          t=h.read_text()
          for old,new in changes.items():
           assert t.count(old)==1,(old,t.count(old))
           t=t.replace(old,new)
          h.write_text(t)
          sw=Path('navarro360-movil/sw.js')
          cache=sw.read_text()
          assert cache.count('navarro360-fullstore-v51-truper-fotos-14400')==1
          cache=cache.replace('navarro360-fullstore-v51-truper-fotos-14400','navarro360-fullstore-v52-truper-fotos-15619')
          for old,new in list(changes.items())[:3]:
           assert cache.count(old)==1,(old,cache.count(old))
           cache=cache.replace(old,new)
          sw.write_text(cache)
          report=json.loads(Path('truper-v52-informe.json').read_text())
          assert report['total_indexed']==15619 and report['verified_extra']==1219
          print('V52 preparada: 15619 códigos vinculados a imágenes; no se cambió catálogo, carrito, WhatsApp ni SIFO.')
          PY
      - name: Publicar a GitHub Pages
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V52: vincular 1219 fotos Truper verificadas adicionales"
          git pull --rebase origin main
          git push origin HEAD:main
