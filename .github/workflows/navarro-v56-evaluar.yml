name: NAVARRO V56 - medir calidad de coincidencias
on:
  push:
    paths:
      - '.github/workflows/navarro-v56-evaluar.yml'
permissions:
  contents: write
jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar motor de pruebas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libglib2.0-0
          python3 -m pip install --quiet 'mediapipe>=0.10.21' pillow numpy
      - name: Evaluar 70 productos en cuatro tipos de fotos
        timeout-minutes: 14
        run: |
          OPENBLAS_NUM_THREADS=1 python3 tools/navarro_v56_evaluar_ranking.py
      - name: Publicar métricas sin modificar tienda
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro-v56-evaluacion.json
          git commit -m "Evaluación de exactitud y relevancia de 280 búsquedas fotográficas"
          for i in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
