name: NAVARRO - verificar clave de Truper
on:
  push:
    paths:
      - .github/workflows/navarro-truper-minitest.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultas de prueba al fabricante
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import json
          qs=['7506240653295','13470','WT-350']
          out=[]
          for q in qs:
           u='https://www.truper.com/banco-contenido-digital/searching/searchByWord?q='+q
           try:
            with urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}),timeout=8) as r:
             raw=r.read(5000)
             out.append({'q':q,'status':r.status,'body':raw.decode('utf-8','replace')[:2000]})
           except Exception as e:out.append({'q':q,'error':str(e)[:300]})
          from pathlib import Path
          Path('truper-prueba-3.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(out)
          PY
      - name: Publicar diagnóstico
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truper-prueba-3.json
          git commit -m "Prueba exacta de búsqueda oficial de Truper"
          git push origin HEAD:main
