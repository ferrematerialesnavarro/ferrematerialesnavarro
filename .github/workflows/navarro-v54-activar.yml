name: NAVARRO V54 - activar busqueda por foto
on:
  push:
    paths:
      - '.github/workflows/navarro-v54-activar.yml'
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprobar que hay imágenes indexadas y código compatible
        shell: bash
        run: |
          node --check navarro360-movil/buscar-foto-v54.js
          python3 - <<'PY'
          from pathlib import Path
          import json,gzip,base64
          p=Path('navarro360-movil/buscar-foto-indice-piloto-v54.json.gz')
          report=json.loads(Path('navarro360-movil/buscar-foto-indice-piloto-info-v54.json').read_text())
          obj=json.loads(gzip.decompress(p.read_bytes()))
          assert obj['version']==54 and obj['dim']==1024
          assert len(obj['codes'])==report['indexed']>=2400
          assert len(base64.b64decode(obj['vectors']))==len(obj['codes'])*1024
          assert len(set(obj['codes']))==len(obj['codes'])
          print('Búsqueda visual: '+str(len(obj['codes']))+' imágenes de prueba verificadas')
          PY
      - name: Incluir cámara en ambos buscadores sin tocar operaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          html=Path('navarro360-movil/index.html')
          if sha(html.read_bytes())!='b4ffac2ed1f2e7b7f6108cab7d754bc5a2d158e4':raise SystemExit('HTML distinto de V53; se cancela por seguridad')
          s=html.read_text()
          assert s.count('</head>')==1 and s.count('sw.js?v=53')==1
          assert 'buscar-foto-v54.js' not in s
          s=s.replace('</head>','<script defer src="./buscar-foto-v54.js?v=54"></script>\n</head>')
          s=s.replace('sw.js?v=53','sw.js?v=54')
          html.write_text(s)
          sw=Path('navarro360-movil/sw.js')
          t=sw.read_text()
          assert t.count('navarro360-fullstore-v53-truper-fotos-15635')==1
          assert t.count("'./carrito-fotos-v44.js?v=52'")==1
          t=t.replace('navarro360-fullstore-v53-truper-fotos-15635','navarro360-fullstore-v54-busqueda-por-imagen')
          t=t.replace("'./carrito-fotos-v44.js?v=52'","'./carrito-fotos-v44.js?v=52','./buscar-foto-v54.js?v=54'")
          sw.write_text(t)
          print('V54 conectada a ambas barras de búsqueda. El índice se descarga solo cuando se toma una foto.')
          PY
      - name: Publicar en GitHub Pages
        shell: bash
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V54: botón foto en buscador y resultados por similitud visual"
          git pull --rebase origin main
          git push origin HEAD:main
