name: NAVARRO V57 - prueba real de búsqueda visual rápida
on:
  push:
    paths:
      - '.github/workflows/navarro-v57-browser-test.yml'
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar versión aislada V57
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('navarro360-movil/index.html').read_text()
          assert t.count('buscar-foto-v56.js?v=56')==1
          Path('navarro360-movil/test-foto-v57.html').write_text(t.replace('buscar-foto-v56.js?v=56','buscar-foto-v57.js?v=57'))
          PY
          node --check navarro360-movil/buscar-foto-v57.js
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir sitio local
        run: |
          nohup python3 -m http.server 8111 --directory navarro360-movil >/tmp/navarro-v57-http.log 2>&1 &
          sleep 2
      - name: Probar tiempos, resultados y aprendizaje visual
        timeout-minutes: 7
        run: node tools/navarro_v57_browser_test.cjs
      - name: Guardar informe de ejecución
        if: always()
        run: |
          if [ -f navarro-v57-browser-result.json ]; then
            git config user.name "NAVARRO 360 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add navarro-v57-browser-result.json
            git commit -m "NAVARRO V57: prueba real de búsqueda más rápida y aprendizaje de elecciones"
            for n in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
