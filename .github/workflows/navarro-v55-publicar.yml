name: NAVARRO V55 - publicar búsqueda visual completa disponible
on:
  push:
    paths:
      - '.github/workflows/navarro-v55-publicar.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar búsqueda visual y resultado del ensayo
        run: |
          node --check navarro360-movil/buscar-foto-v55.js
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,gzip
          report=json.loads(Path('navarro360-movil/buscar-foto-indice-info-v55.json').read_text())
          data=json.loads(gzip.decompress(Path('navarro360-movil/buscar-foto-indice-v55.json.gz').read_bytes()))
          assert report['visual_index_total']==15953
          assert len(data['codes'])==15953 and len(set(data['codes']))==15953
          assert len(base64.b64decode(data['vectors']))==15953*1024
          test=json.loads(Path('test-browser-foto-v55.json').read_text())
          assert test.get('success') is True,test.get('errors')
          assert 'Modelo visual analiza recorte sin errores' in test['passed']
          print('V55 validada: 15953 fotos, recorte y resultados en navegador')
          PY
      - name: Actualizar solo script de búsqueda y caché
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          h=Path('navarro360-movil/index.html')
          if sha(h.read_bytes())!='e0fd70b6af201d881c5146e1ec985bcc0ab9f9ba':
           raise SystemExit('HTML distinto de la versión verificada; sin modificaciones')
          text=h.read_text()
          assert text.count('buscar-foto-v54.js?v=542')==1
          assert text.count('sw.js?v=542')==1
          text=text.replace('buscar-foto-v54.js?v=542','buscar-foto-v55.js?v=55')
          text=text.replace('sw.js?v=542','sw.js?v=55')
          h.write_text(text)
          sw=Path('navarro360-movil/sw.js')
          src=sw.read_text()
          assert src.count('navarro360-fullstore-v542-motor-visual-local')==1
          assert src.count("'./buscar-foto-v54.js?v=542'")==1
          src=src.replace('navarro360-fullstore-v542-motor-visual-local','navarro360-fullstore-v55-busqueda-visual-recorte')
          src=src.replace("'./buscar-foto-v54.js?v=542'","'./buscar-foto-v55.js?v=55'")
          sw.write_text(src)
          print('Solo se cambian referencias de motor visual y cache, NO catalogo/precios/lector/carrito/SIFO')
          PY
      - name: Publicar NAVARRO 360
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V55: búsqueda visual con 15953 fotos, recorte y sugerencias verificables"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
