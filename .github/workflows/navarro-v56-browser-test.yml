name: NAVARRO V56 - comprobar grupos e imágenes
on:
  push:
    paths:
      - '.github/workflows/navarro-v56-browser-test.yml'
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Montar copia de prueba de NAVARRO 360
        run: |
          node --check navarro360-movil/buscar-foto-v56.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('navarro360-movil/index.html')
          s=p.read_text()
          assert s.count('buscar-foto-v55.js?v=55')==1
          s=s.replace('buscar-foto-v55.js?v=55','buscar-foto-v56.js?v=56')
          Path('navarro360-movil/test-foto-v56.html').write_text(s)
          PY
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir sitio de prueba sin modificar versión pública
        run: |
          nohup python3 -m http.server 8111 --directory navarro360-movil >/tmp/navarro-v56-http.log 2>&1 &
          sleep 2
      - name: Buscar fotos, agrupar y desplegar las variantes
        timeout-minutes: 7
        run: node tools/navarro_v56_browser_test.cjs
      - name: Guardar reporte para auditoría
        if: always()
        run: |
          if [ -f navarro-v56-browser-result.json ]; then
            git config user.name "NAVARRO 360 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add navarro-v56-browser-result.json
            git commit -m "Resultado de pruebas de relevancia y variantes visuales NAVARRO V56"
            for n in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
