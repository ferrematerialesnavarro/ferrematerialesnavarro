name: NAVARRO Truper V52 - revisar segundo catálogo
on:
  push:
    paths:
      - '.github/workflows/navarro-truper-fuentes-v52.yml'
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sitemap y fichas de distribuidor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from urllib.parse import unquote,urljoin
          from html import unescape
          import json,re
          urls=[
          'https://ferrexmayorista.com/sitemap.xml',
          'https://ferrexmayorista.com/tienda/catalogo-truper-2026/',
          'https://ferrexmayorista.com/tienda/producto/4210/bateria-ion-litio-20v-4-ah-truper-pro/',
          ]
          out=[]
          for url in urls:
           row={'url':url}
           try:
            req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xml'})
            with urlopen(req,timeout=30) as res:
             raw=res.read(12000000);row.update(status=res.status,size=len(raw),type=res.headers.get('Content-Type'))
            txt=raw.decode('utf-8','replace')
            row['loc_count']=txt.count('<loc>')
            row['product_count']=len(re.findall(r'<loc>https://ferrexmayorista\.com/tienda/producto/',txt,re.I))
            row['examples']=re.findall(r'<loc>([^<]+)</loc>',txt)[:8]
            row['product_links']=re.findall(r'href=["\\x27]([^"\\x27]+/tienda/producto/[^"\\x27]+)',txt,re.I)[:15]
            row['image_links']=re.findall(r'(?:src|content)=["\\x27]([^"\\x27]+\\.(?:png|webp|jpe?g)(?:\\?[^"\\x27]+)?)',txt,re.I)[:15]
            for tag in ['EAN','Código:','Clave:','main-product','og:image','product-image','pagination','next_page']:
             ix=txt.lower().find(tag.lower());row[tag]=txt[max(0,ix-110):ix+260] if ix>=0 else ''
            row['head']=txt[:900]
            row['tail']=txt[-650:]
           except Exception as e:row['error']=repr(e)
           out.append(row)
          Path("navarro-truper-fuentes-ferrex-v52.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print([(x['url'],x.get('size'),x.get('loc_count'),x.get('product_count'),x.get('error')) for x in out])
          
          PY
      - name: Publicar auditoría de fuente
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro-truper-fuentes-ferrex-v52.json
          git commit -m "NAVARRO V52: verificar catálogo público de referencia por código"
          git push origin HEAD:main
