name: NAVARRO V60 - comprobar boceto aprobado en móvil
on:
  push:
    paths:
      - '.github/workflows/navarro-v60-prueba.yml'
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar versión de prueba sin tocar la tienda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('navarro360-movil/index.html')
          src=p.read_text()
          assert src.count('</head>')==1
          assert 'tarjetas-boceto-v60.css' not in src
          Path('navarro360-movil/test-v60.html').write_text(src.replace('</head>','<link rel="stylesheet" href="./tarjetas-boceto-v60.css?v=60">\n</head>'))
          PY
      - name: Instalar Chromium para prueba móvil
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir versión aislada
        run: |
          nohup python3 -m http.server 8111 --directory navarro360-movil >/tmp/navarro-v60.log 2>&1 &
          sleep 2
      - name: Verificar marcos y tarjetas en móvil/tablet
        timeout-minutes: 6
        run: node tools/navarro_v60_mobile_test.cjs
      - name: Guardar mediciones y captura para revisar
        if: always()
        run: |
          if [ -f navarro-v60-mobile-test.json ]; then
            git config user.name "NAVARRO 360 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add navarro-v60-mobile-test.json
            git commit -m "NAVARRO V60: mediciones y captura del diseño aprobado en iPhone"
            for n in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
