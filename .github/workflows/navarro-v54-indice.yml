name: NAVARRO V54 - crear indice de similitud visual
on:
  push:
    paths:
      - '.github/workflows/navarro-v54-indice.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar procesamiento de imágenes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libglib2.0-0
          python3 -m pip install --quiet 'mediapipe>=0.10.21' pillow numpy
      - name: Calcular vectores visuales del banco de fotos
        timeout-minutes: 27
        run: python3 tools/navarro_v54_crear_indice.py
      - name: Comprobar tamaño y cantidad de productos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,gzip
          p=Path('navarro360-movil/buscar-foto-indice-v54.json.gz')
          data=json.loads(gzip.decompress(p.read_bytes()))
          assert data['version']==54 and data['dim']==1024
          assert len(data['codes'])>=2000
          assert len(set(data['codes']))==len(data['codes'])
          print('Index ready',len(data['codes']), 'data bytes',p.stat().st_size)
          PY
      - name: Publicar vectores, sin modificar la página aún
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/buscar-foto-indice-v54.json.gz navarro360-movil/buscar-foto-indice-info-v54.json
          git commit -m "NAVARRO V54: índice fotográfico del catálogo para búsqueda visual"
          git pull --rebase origin main
          git push origin HEAD:main
