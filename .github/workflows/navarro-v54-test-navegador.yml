name: NAVARRO V54 - test navegador fotografia
on:
  push:
    paths:
      - '.github/workflows/navarro-v54-test-navegador.yml'
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar página de pruebas
        run: |
          nohup python3 -m http.server 8111 --directory navarro360-movil >/tmp/navarro-http.log 2>&1 &
          sleep 2
      - name: Probar búsqueda y selección sin modificar carrito
        timeout-minutes: 5
        run: node tools/navarro_v54_browser_test.cjs
      - name: Guardar diagnóstico de la prueba
        if: always()
        run: |
          if test -f test-browser-foto-v54.json; then
            git config user.name "NAVARRO 360 (GitHub Actions)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test-browser-foto-v54.json
            git commit -m "NAVARRO V54: diagnóstico del buscador fotográfico en navegador"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Repetir prueba usando botón de cámara visible.

