name: NAVARRO V51 - publicar 14400 fotos asociadas
on:
  push:
    paths:
      - '.github/workflows/navarro-v51-activar.yml'
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar asociación total del catálogo
        run: |
          node --check navarro360-movil/truper-fotos-catalogo-v51.js
          node --check navarro360-movil/truper-fotos-integracion-v48.js
          node --check navarro360-movil/carrito-fotos-v44.js
          node -e "global.window={};require('./navarro360-movil/truper-fotos-catalogo-v51.js');const n=Object.keys(window.NAVARRO_FOTOS_TRUPER_V48).length;if(n!==14400)throw Error('Error: '+n);console.log('14400 asociaciones de foto comprobadas')"
      - name: Activar imágenes para tarjetas y carrito
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('navarro360-movil/index.html')
          old='62a7b23ebe8c96c95abd91bd47a8ad35840034f1'
          if sha(p.read_bytes())!=old:raise SystemExit('HTML difiere de V50; cancelar sin cambiar')
          html=p.read_text()
          assert html.count('truper-fotos-catalogo-v50.js?v=50')==1
          assert html.count('sw.js?v=50')==1
          p.write_text(html.replace('truper-fotos-catalogo-v50.js?v=50','truper-fotos-catalogo-v51.js?v=51').replace('sw.js?v=50','sw.js?v=51'))
          sw=Path('navarro360-movil/sw.js')
          txt=sw.read_text()
          assert txt.count('navarro360-fullstore-v50-truper-fotos-14133')==1
          assert txt.count('truper-fotos-catalogo-v50.js?v=50')==1
          txt=txt.replace('navarro360-fullstore-v50-truper-fotos-14133','navarro360-fullstore-v51-truper-fotos-14400')
          txt=txt.replace('truper-fotos-catalogo-v50.js?v=50','truper-fotos-catalogo-v51.js?v=51')
          sw.write_text(txt)
          report=json.loads(Path('truper-v51-informe.json').read_text())
          assert report['total']==14400 and report['verified_new']==267
          print('V51 aplicada, catálogo y venta sin modificaciones.')
          PY
      - name: Publicar sitio móvil
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V51: publicar 14400 fotos asociadas a SKU Truper"
          git push origin HEAD:main
