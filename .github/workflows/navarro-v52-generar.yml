name: NAVARRO V52 - fotos Truper faltantes por codigo exacto
on:
  push:
    paths:
      - '.github/workflows/navarro-v52-generar.yml'
permissions:
  contents: write
jobs:
  asociar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar comparador de claves
        run: python3 -m pip install --quiet rapidfuzz
      - name: Verificar fotografía de los códigos pendientes
        timeout-minutes: 12
        run: python3 tools/navarro_truper_fotos_v52.py
      - name: Revisar sintaxis del nuevo índice
        run: node --check navarro360-movil/truper-fotos-catalogo-v52.js
      - name: Guardar mapa y auditoría sin activar todavía
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/truper-fotos-catalogo-v52.js truper-v52-informe.json
          git commit -m "NAVARRO V52: nuevas imágenes Truper verificadas contra EAN de segunda fuente"
          git push origin HEAD:main
