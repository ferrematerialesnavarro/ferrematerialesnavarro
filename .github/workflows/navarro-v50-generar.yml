name: NAVARRO V50 - completar fotos Truper por EAN
on:
  push:
    paths:
      - .github/workflows/navarro-v50-generar.yml
permissions:
  contents: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar comparador de descripciones
        run: python3 -m pip install --quiet rapidfuzz
      - name: Verificar fichas restantes por código y no por parecido
        timeout-minutes: 17
        run: python3 tools/navarro_truper_fotos_v50.py
      - name: Revisar sintaxis de índice de imágenes
        run: node --check navarro360-movil/truper-fotos-catalogo-v50.js
      - name: Publicar índice revisado sin alterar la tienda
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/truper-fotos-catalogo-v50.js truper-v50-informe.json
          git commit -m "NAVARRO V50: catálogo ampliado de fotos Truper con EAN validado"
          git push origin HEAD:main
