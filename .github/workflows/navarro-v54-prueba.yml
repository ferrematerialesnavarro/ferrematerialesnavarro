name: NAVARRO V54 - prueba búsqueda visual
on:
  push:
    paths:
      - '.github/workflows/navarro-v54-prueba.yml'
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar librerías para el modelo visual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libglib2.0-0
      - name: Instalar tecnología de comparación visual
        run: python3 -m pip install --quiet "mediapipe>=0.10.21" pillow numpy
      - name: Probar imágenes y revisar HTML
        timeout-minutes: 4
        run: python3 tools/navarro_v54_diagnosticar.py
      - name: Guardar diagnóstico sin modificar página
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico-busqueda-foto-v54.json
          git commit -m "NAVARRO V54: diagnóstico de búsqueda visual local"
          git pull --rebase origin main
          git push origin HEAD:main
