name: NAVARRO 360 V47 - fotos plomeria al carrito
on:
  push:
    paths:
      - '.github/workflows/navarro-v47-temporal.yml'
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar asociación del carrito
        run: node --check navarro360-movil/carrito-fotos-v44.js
      - name: Generar mapa fotográfico autorizado por SKU
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('navarro360-movil/index.html')
          assert sha(p.read_bytes())=='edb0d823eee730fafe9ad6636acb5319af1e3ced','HTML cambió: no modificar'
          s=p.read_text()
          atlas=json.loads(re.search(r'window.NAVARRO_ATLAS=(\{[^;]+\});',s).group(1))
          mapping={}
          for key in ['NAVARRO_PVC_FOTOS_TODAS','NAVARRO_PVC_FOTOS_ESPECIALES','NAVARRO_CPVC_FOTOS']:
              found=re.search('const '+key+r'=(\{[^;]+\});',s)
              assert found is not None,key
              sub=json.loads(found.group(1))
              for code,file in sub.items():
                  assert str(code).isdigit() and len(str(code))>=5,code
                  assert file in atlas['files'],(code,file)
              mapping.update(sub)
          assert len(mapping)>=120
          assert mapping.get('7777001082')=='navarro-pvc-forma-tubo.webp'
          out=Path('navarro360-movil/fotos-plomeria-carrito-v47.js')
          out.write_text('/* NAVARRO V47: fotos verificadas del atlas, exactamente por SKU. */\nwindow.NAVARRO_FOTOS_PLOMERIA_V47=Object.freeze('+json.dumps(mapping,ensure_ascii=False,separators=(',',':'))+');\n')
          assert s.count('<script defer src="./carrito-fotos-v44.js?v=461"></script>')==1
          assert s.count('sw.js?v=461')==1
          s=s.replace('<script defer src="./carrito-fotos-v44.js?v=461"></script>','<script defer src="./fotos-plomeria-carrito-v47.js?v=47"></script>\n<script defer src="./carrito-fotos-v44.js?v=47"></script>')
          s=s.replace('sw.js?v=461','sw.js?v=47')
          p.write_text(s)
          sw=Path('navarro360-movil/sw.js')
          t=sw.read_text()
          assert t.count('navarro360-fullstore-v461-fotos-sku-prioridad')==1
          assert t.count('carrito-fotos-v44.js?v=461')==1
          t=t.replace('navarro360-fullstore-v461-fotos-sku-prioridad','navarro360-fullstore-v47-fotos-plomeria-carrito')
          t=t.replace("'./carrito-fotos-v44.js?v=461'","'./fotos-plomeria-carrito-v47.js?v=47','./carrito-fotos-v44.js?v=47'")
          sw.write_text(t)
          print('V47: '+str(len(mapping))+' fotos PVC/CPVC enlazadas con carrito; tubo 7777001082 validado')
          PY
          node --check navarro360-movil/fotos-plomeria-carrito-v47.js
      - name: Publicar y conservar las funciones existentes
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js navarro360-movil/fotos-plomeria-carrito-v47.js
          git commit -m "NAVARRO 360 V47: asociar fotos de PVC y CPVC al carrito por SKU"
          git push origin HEAD:main
