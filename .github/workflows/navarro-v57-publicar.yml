name: NAVARRO V57 - publicar buscador por foto rápido
on:
  push:
    paths:
      - '.github/workflows/navarro-v57-publicar.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprobar motor visual, índice y pruebas reales
        run: |
          node --check navarro360-movil/buscar-foto-v57.js
          python3 - <<'PY'
          from pathlib import Path
          import json,gzip,struct
          doc=json.loads(Path('navarro-v57-browser-result.json').read_text())
          assert doc['success'] is True,doc['errors']
          assert 'El artículo elegido asciende a primera opción al repetir fotografía' in doc['checks']
          assert doc['times']['coldMs']>0 and doc['times']['warmMs']>0
          report=json.loads(Path('navarro360-movil/buscar-foto-indice-info-v57.json').read_text())
          assert report['codes']==15953 and report['size_reduction_percent']>20
          data=gzip.decompress(Path('navarro360-movil/buscar-foto-indice-v57.bin.gz').read_bytes())
          assert data[:8]==b'NAV57BIN'
          version,dim,count,length=struct.unpack_from('<IIII',data,8)
          assert (version,dim,count)==(57,1024,15953)
          assert len(data)==24+length+15953*1024
          print('Validado: respuesta rápida, índice sin pérdida y aprendizaje local')
          PY
      - name: Activar nueva versión sin modificar pedidos o catálogo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          h=Path('navarro360-movil/index.html')
          if sha(h.read_bytes())!='847cdbc8c8f4eb24e8bbd63a4dba24262336998a':
           raise SystemExit('El HTML cambió. Se cancela para evitar sobrescribir avances')
          text=h.read_text()
          assert text.count('buscar-foto-v56.js?v=56')==1
          assert text.count('sw.js?v=56')==1
          h.write_text(text.replace('buscar-foto-v56.js?v=56','buscar-foto-v57.js?v=57').replace('sw.js?v=56','sw.js?v=57'))
          sw=Path('navarro360-movil/sw.js')
          s=sw.read_text()
          assert s.count('navarro360-fullstore-v56-ranking-por-familias')==1
          assert s.count("'./buscar-foto-v56.js?v=56'")==1
          s=s.replace('navarro360-fullstore-v56-ranking-por-familias','navarro360-fullstore-v57-busqueda-rapida-y-aprendizaje')
          s=s.replace("'./buscar-foto-v56.js?v=56'","'./buscar-foto-v57.js?v=57'")
          sw.write_text(s)
          print('V57: solo versión de script fotográfico y caché. Precios, carrito, lector, WhatsApp y SIFO intactos.')
          PY
      - name: Publicar en GitHub Pages
        run: |
          git config user.name "NAVARRO 360 (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navarro360-movil/index.html navarro360-movil/sw.js
          git commit -m "NAVARRO V57: búsqueda visual 20% más ligera con aprendizaje local"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
